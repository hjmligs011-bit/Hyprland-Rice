
# ==============================
# FONT - JetBrains Mono Nerd
# ==============================

font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 13.0

# ==============================
# CATPPUCCIN MOCHA
# ==============================

foreground            #cdd6f4
background            #1e1e2e
selection_foreground  #1e1e2e
selection_background  #89b4fa
cursor                #f5e0dc
cursor_text_color     #1e1e2e

# Black
color0  #45475a
color8  #585b70

# Red
color1  #f38ba8
color9  #f38ba8

# Green
color2  #a6e3a1
color10 #a6e3a1

# Yellow
color3  #f9e2af
color11 #f9e2af

# Blue
color4  #89b4fa
color12 #89b4fa

# Magenta
color5  #f5c2e7
color13 #f5c2e7

# Cyan
color6  #94e2d5
color14 #94e2d5

# White
color7  #bac2de
color15 #a6adc8

# ==============================
# WINDOW
# ==============================

window_padding_width 10
hide_window_decorations yes
confirm_os_window_close 0
```

**Aplicar as alterações:**

```bash
kitty @ set-colors --all ~/.config/kitty/current-theme.conf
```

Para aplicar a configuração completa, feche e abra o Kitty novamente ou pressione `Ctrl + Shift + F5`.

